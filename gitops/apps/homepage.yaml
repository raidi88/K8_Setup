# gethomepage.dev "Homepage" — dashboard listing every self-hosted app in one place.
# No official Helm chart, so app-template again (same reasoning as jellyfin.yaml/
# adguard.yaml). Entirely config-as-code: all of Homepage's config lives in the
# ConfigMap in homepage-config-configmap.yaml (alongside this file), mounted read-only
# via individual subPaths -- not the whole /app/config directory -- so Homepage's own
# default files (bookmarks/docker/kubernetes.yaml etc. it may want to write) aren't
# blocked by a directory-wide mount.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/bjw-s-labs/helm
    chart: app-template
    targetRevision: 5.0.1
    helm:
      valuesObject:
        controllers:
          homepage:
            containers:
              app:
                image:
                  repository: ghcr.io/gethomepage/homepage
                  tag: latest
                env:
                  HOMEPAGE_ALLOWED_HOSTS: homepage.homelab.local
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    memory: 256Mi

        service:
          app:
            controller: homepage
            ports:
              http:
                port: 3000

        ingress:
          app:
            className: nginx
            annotations:
              nginx.ingress.kubernetes.io/limit-rps: "10"
              nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
            hosts:
              - host: homepage.homelab.local
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: app
                      port: http

        persistence:
          settings:
            type: configMap
            name: homepage-config
            globalMounts:
              - path: /app/config/settings.yaml
                subPath: settings.yaml
                readOnly: true
          services:
            type: configMap
            name: homepage-config
            globalMounts:
              - path: /app/config/services.yaml
                subPath: services.yaml
                readOnly: true
          widgets:
            type: configMap
            name: homepage-config
            globalMounts:
              - path: /app/config/widgets.yaml
                subPath: widgets.yaml
                readOnly: true
          bookmarks:
            type: configMap
            name: homepage-config
            globalMounts:
              - path: /app/config/bookmarks.yaml
                subPath: bookmarks.yaml
                readOnly: true
          # Read-only, same NFS export as jellyfin.yaml -- purely so the resource
          # widget can report real usage on the actual bulk media drives, not just
          # this pod's tiny local-path root disk (which is what it showed before).
          media1:
            type: nfs
            server: 192.168.0.150
            path: /mnt/media1
            globalMounts:
              - path: /mnt/media1
                readOnly: true
          media2:
            type: nfs
            server: 192.168.0.150
            path: /mnt/media2
            globalMounts:
              - path: /mnt/media2
                readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
