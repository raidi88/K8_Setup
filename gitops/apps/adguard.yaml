# No official AdGuard Home Helm chart; reusing app-template (same as jellyfin.yaml)
# rather than risk another unofficial chart with unstable hosting.
#
# Two separate Services on purpose: DNS (port 53, TCP+UDP) gets its own dedicated
# MetalLB LoadBalancer IP per design.md ("Adguard Home — MetalLB LoadBalancer IP, port
# 53 exposed") — it's not HTTP, so it can't go through ingress-nginx like the web UI can.
#
# Storage on local-path, NOT NFS — same situation as jellyfin/nextcloud, still on hold.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/bjw-s-labs/helm
    chart: app-template
    targetRevision: 5.0.1
    helm:
      valuesObject:
        controllers:
          adguard:
            containers:
              app:
                image:
                  repository: adguard/adguardhome
                  tag: latest
                env:
                  TZ: "Etc/UTC"
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    memory: 512Mi

        service:
          web:
            controller: adguard
            ports:
              http:
                port: 3000
          dns:
            controller: adguard
            type: LoadBalancer
            ports:
              dns-tcp:
                port: 53
                protocol: TCP
              dns-udp:
                port: 53
                protocol: UDP

        ingress:
          web:
            className: nginx
            annotations:
              nginx.ingress.kubernetes.io/limit-rps: "10"
              nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
            hosts:
              - host: adguard.homelab.local
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: web
                      port: http

        persistence:
          config:
            enabled: true
            accessMode: ReadWriteOnce
            size: 1Gi
            storageClass: local-path
            globalMounts:
              - path: /opt/adguardhome/conf
          work:
            enabled: true
            accessMode: ReadWriteOnce
            size: 1Gi
            storageClass: local-path
            globalMounts:
              - path: /opt/adguardhome/work
  destination:
    server: https://kubernetes.default.svc
    namespace: adguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
