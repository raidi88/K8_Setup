# Self-hosted MinIO — S3-compatible object storage, existing purely as Velero's backup
# storage target (velero.yaml, alongside this file). Official chart: charts.min.io.
#
# Standalone mode (single instance/drive, no erasure coding) — this is a homelab backup
# target, not itself a highly-available store. Root credentials come from a plain
# Secret (`minio-root-creds`), created directly via kubectl rather than a SealedSecret
# like Nextcloud's — this is purely internal backup-system plumbing, not a user-facing
# app, and avoided a slow kubeseal binary download (see the ghcr.io/GitHub-release-
# assets network gotcha in implementation-plan.md). Referenced by name only from here.
#
# Real limitation worth flagging: storage is a local-path PVC on the same node/disk as
# everything it's backing up — this protects against operator error (bad kubectl apply,
# accidental deletion, a broken GitOps sync) but NOT against actual disk/hardware
# failure, since there's no second physical disk in this homelab to put backups on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.4.0
    helm:
      valuesObject:
        mode: standalone
        existingSecret: minio-root-creds

        persistence:
          enabled: true
          storageClass: local-path
          size: 20Gi

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

        buckets:
          - name: velero-backups
            policy: none
            purge: false

        consoleIngress:
          enabled: true
          ingressClassName: nginx
          annotations:
            nginx.ingress.kubernetes.io/limit-rps: "10"
            nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
          hosts:
            - minio.homelab.local
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
