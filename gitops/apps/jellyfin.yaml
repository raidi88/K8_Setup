# Jellyfin has no official Helm chart, so this uses bjw-s's "app-template" — the
# de facto standard the self-hosted community uses for wrapping a plain container image
# in a proper Deployment/Service/Ingress/PVC set. (TrueCharts, the other common option,
# has restructured its chart hosting twice in ways that broke the expected URLs — see
# core-services.tf's sealed-secrets fix for a similar case — so app-template was picked
# as the more stable option.)
#
# Config stays on local-path (small, needs read-write for Jellyfin's DB/settings).
# Media mounts the two real drives directly via app-template's `type: nfs` persistence
# (not a PVC/StorageClass) -- nfs-subdir-external-provisioner was tried first and
# doesn't work here: it dynamically creates a NEW empty subdirectory per PVC, which
# both can't expose an already-populated media tree and needs write access to the
# export root, which the deliberately-read-only export blocks. `type: nfs` just mounts
# the existing export directly, read-only, which is what this actually needs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/bjw-s-labs/helm
    chart: app-template
    targetRevision: 5.0.1
    helm:
      valuesObject:
        controllers:
          jellyfin:
            containers:
              app:
                image:
                  repository: jellyfin/jellyfin
                  tag: latest
                env:
                  TZ: "Etc/UTC"
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    memory: 2Gi

        service:
          app:
            controller: jellyfin
            ports:
              http:
                port: 8096

        ingress:
          app:
            className: nginx
            hosts:
              - host: jellyfin.homelab.local
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: app
                      port: http

        persistence:
          config:
            enabled: true
            accessMode: ReadWriteOnce
            size: 1Gi
            storageClass: local-path
            globalMounts:
              - path: /config
          media1:
            type: nfs
            server: 192.168.0.150
            path: /mnt/media1
            globalMounts:
              - path: /media/drive1
                readOnly: true
          media2:
            type: nfs
            server: 192.168.0.150
            path: /mnt/media2
            globalMounts:
              - path: /media/drive2
                readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
