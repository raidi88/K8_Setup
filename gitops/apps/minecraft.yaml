# Official itzg/minecraft-server-charts chart. Storage on local-path, NOT NFS — same
# situation as the other apps, still on hold pending real bulk-storage hardware.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://itzg.github.io/minecraft-server-charts/
    chart: minecraft
    targetRevision: 5.1.3
    helm:
      valuesObject:
        minecraftServer:
          eula: "TRUE"
          version: "LATEST"
          type: "VANILLA"
          serviceType: LoadBalancer
          loadBalancerIP: 192.168.0.243
          servicePort: 25565
          memory: "2G"

        resources:
          requests:
            memory: 2Gi
            cpu: 500m
          limits:
            memory: 3Gi

        persistence:
          dataDir:
            enabled: true
            Size: 5Gi
            accessModes:
              - ReadWriteOnce
            storageClass: local-path
  destination:
    server: https://kubernetes.default.svc
    namespace: minecraft
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
