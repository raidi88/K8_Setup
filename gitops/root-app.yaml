# The "app of apps" root Application. ArgoCD watches this, which in turn watches
# everything under gitops/apps/ — one child Application per service (Phase 6).
#
# Apply with:
#   kubectl --kubeconfig infra/kubeconfig apply -f gitops/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/raidi88/K8_Setup.git
    targetRevision: master
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
